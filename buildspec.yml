version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging into Amazon ECR"
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URI=${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/poststack-migration-uat-app
      - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
      - IMAGE_TAG=build-${CODEBUILD_BUILD_NUMBER}
      - echo "ECR_URI=${ECR_URI}"
      - echo "IMAGE_TAG=${IMAGE_TAG}"

  build:
    commands:
      - echo "Validating application"
      - python3 -m py_compile test-app/app.py
      - echo "Building Docker image"
      - docker build -t ${ECR_URI}:${IMAGE_TAG} ./test-app

  post_build:
    commands:
      - echo "Pushing image to ECR"
      - docker push ${ECR_URI}:${IMAGE_TAG}
      - echo "Creating ECS deployment artifact"
      - printf '[{"name":"app","imageUri":"%s"}]' "${ECR_URI}:${IMAGE_TAG}" > imagedefinitions.json
      - echo "Deployment artifact:"
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
